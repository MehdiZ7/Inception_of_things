apiVersion: v1
kind: ConfigMap
metadata:
  name: app1
data:
  index.html: |
    <!doctype html>
    <html>
      <body><h1>Welcome from APP1</h1></body>
    </html>

---

apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  type: ClusterIP
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: nginx:stable-alpine3.24
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          ports:
            - containerPort: 80
      volumes:
        - name: html
          configMap:
            name: app1
            defaultMode: 0444
            items:
              - key: index.html
                path: index.html
